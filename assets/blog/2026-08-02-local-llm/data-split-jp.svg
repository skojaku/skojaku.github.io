<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 270" font-family="Menlo, Consolas, 'Courier New', 'Hiragino Sans', monospace">
  <defs>
    <marker id="arrow-jp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- 自分のデータ -->
  <rect x="170" y="14" width="140" height="34" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="36" text-anchor="middle" font-size="14" fill="#1a1a1a">自分のデータ</text>

  <!-- arrow down -->
  <line x1="240" y1="48" x2="240" y2="82" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow-jp)"/>

  <!-- 送ってよいか? -->
  <rect x="150" y="84" width="180" height="34" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="106" text-anchor="middle" font-size="14" fill="#1a1a1a">送ってよいか?</text>

  <!-- branch lines -->
  <path d="M 200 118 C 160 140, 120 150, 105 168" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow-jp)"/>
  <path d="M 280 118 C 320 140, 360 150, 375 168" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow-jp)"/>

  <text x="140" y="140" text-anchor="middle" font-size="12" fill="#666">はい</text>
  <text x="345" y="140" text-anchor="middle" font-size="12" fill="#666">いいえ</text>

  <!-- クラウドLLM -->
  <rect x="25" y="170" width="160" height="60" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="105" y="196" text-anchor="middle" font-size="14" fill="#1a1a1a">クラウドLLM</text>
  <text x="105" y="215" text-anchor="middle" font-size="11" fill="#666">(フロンティアモデル)</text>

  <!-- ローカルLLM -->
  <rect x="295" y="170" width="160" height="60" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="375" y="196" text-anchor="middle" font-size="14" fill="#1a1a1a">ローカルLLM</text>
  <text x="375" y="215" text-anchor="middle" font-size="11" fill="#666">(自分のマシン)</text>

  <!-- footnotes -->
  <text x="105" y="248" text-anchor="middle" font-size="11" fill="#888">Office、Gmail、カレンダーなど</text>
  <text x="375" y="248" text-anchor="middle" font-size="11" fill="#888">私的データを扱う日常タスク</text>
</svg>
